[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "subjviz"
version = "0.1.0"
description = "Interactive visualizer for subjective logic operators, computed with SUBJ"
readme = "../README.md"
requires-python = ">=3.9"
# pysubj is not on PyPI; build it with scripts/build_pysubj.sh
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
subjviz = "subjviz.__main__:main"

[tool.setuptools.packages.find]
include = ["subjviz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
